[workspace]
resolver = "2"
members = ["crates/porog-core", "porog-ui-gtk"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
authors = ["Cal St Francis <calstfrancis@gmail.com>"]
repository = "https://github.com/calstfrancis/porog"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The status-file schema shared with the Fond apps, from fond-core.
fond-status = { git = "https://github.com/calstfrancis/fond-core", rev = "28d95c1491bdda6e708c04ce2768f89374e62338" }
