[workspace]
resolver = "2"
members = ["crates/porog-core", "porog-ui-gtk"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
authors = ["Cal St Francis <calstfrancis@gmail.com>"]
repository = "https://github.com/calstfrancis/porog"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The status-file schema shared with the Fond apps. A sibling checkout for now: fond-status
# is not on GitHub yet. Switch to `git = ".../fond-core", rev = "..."` once it is pushed,
# because the flatpak and CI builds cannot see a sibling directory.
fond-status = { path = "../fond-core/crates/fond-status" }
